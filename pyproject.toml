[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "hns_face_detection"
authors = [{name = "HNS Face Detection"}]
description = "Face identification and manually confirmed ERPNext employee check-in/out for Frappe v15"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "numpy",
    "opencv-python-headless",
    "insightface",
    "onnxruntime",
    "Pillow",
    "scikit-image",
    "scipy",
    "tqdm",
    "requests",
    "onnx",
]

[deploy.dependencies.apt]
packages = [
    "libgl1",
    "libglib2.0-0",
    "libsm6",
    "libxext6",
    "libxrender1",
]

[tool.flit.module]
name = "hns_face_detection"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
